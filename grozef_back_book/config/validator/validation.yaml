App\Entity\AstonishingVideo:
    properties:
        title:
            - NotBlank: { message: "Le titre est requis." }
            - Length:
                max: 255
                maxMessage: "Le titre ne peut pas dépasser {{ limit }} caractères."
        authorFirstName:
            - NotBlank: { message: "Le prénom de l'auteur est requis." }
            - Length:
                max: 255
                maxMessage: "Le prénom de l'auteur ne peut pas dépasser {{ limit }} caractères."
        authorLastName:
            - NotBlank: { message: "Le nom de l'auteur est requis." }
            - Length:
                max: 255
                maxMessage: "Le nom de l'auteur ne peut pas dépasser {{ limit }} caractères."
        rating:
            - Type:
                type: integer
                message: "La note doit être un entier."
            - Range:
                min: 1
                max: 5
                notInRangeMessage: "La note doit être entre {{ min }} et {{ max }}."
        isPublic:
            - NotNull: { message: "La visibilité publique est requise." }
            - Type:
                type: boolean
                message: "La visibilité publique doit être un booléen."
        publishDate:
            - Type:
                type: DateTime
                message: "La date de publication doit être une date valide."
        publisher:
            - Length:
                max: 255
                maxMessage: "L'éditeur ne peut pas dépasser {{ limit }} caractères."
        filepath:
            - Length:
                max: 255
                maxMessage: "Le chemin du fichier ne peut pas dépasser {{ limit }} caractères."
        fiercePublishers:
            - Valid: ~

App\Entity\FiercePublisher:
    properties:
        name:
            - NotBlank: { message: "Le nom de l'éditeur est requis." }
            - Length:
                max: 255
                maxMessage: "Le nom de l'éditeur ne peut pas dépasser {{ limit }} caractères."
        address:
            - Length:
                max: 255
                maxMessage: "L'adresse ne peut pas dépasser {{ limit }} caractères."
        tel:
            - Length:
                max: 255
                maxMessage: "Le numéro de téléphone ne peut pas dépasser {{ limit }} caractères."
        email:
            - Length:
                max: 255
                maxMessage: "L'email ne peut pas dépasser {{ limit }} caractères."
            - Email:
                message: "L'email doit être valide."
        postalCode:
            - Length:
                max: 255
                maxMessage: "Le code postal ne peut pas dépasser {{ limit }} caractères."
        country:
            - Length:
                max: 255
                maxMessage: "Le pays ne peut pas dépasser {{ limit }} caractères."
        astonishingVideos:
            - Valid: ~
        stunningImages:
            - Valid: ~
        wonderfullBooks:
            - Valid: ~

